server:
  port: 8080

spring:
  application:
    name: lebonexchange-api
  datasource:
    url: ${API_DB_URL:jdbc:postgresql://localhost:5432/exchange_db}
    username: ${API_DB_USERNAME:exchange_user}
    password: ${API_DB_PASSWORD:exchange_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  level:
    root: INFO
    com.lebonexchange.api: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
